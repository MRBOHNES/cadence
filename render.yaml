services:
  - type: web
    name: cadence-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon   # must match the Neon project's region (AWS US West 2)
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL   # Neon connection string; set in the Render dashboard
        sync: false
      - key: CRON_SECRET    # same value as the GitHub Actions secret
        sync: false
      - key: CORS_ORIGIN    # your Vercel URL, e.g. https://cadence.vercel.app
        sync: false
