name: Sweep

# Triggers the monitoring sweep on the deployed API every 5 minutes.
# GitHub cron is best-effort: runs can start a few minutes late.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Render's free tier sleeps when idle, so the first request can take ~1 minute while
      # the service boots. --max-time 150 covers that; --retry 1 gives one more attempt
      # (--retry-all-errors also retries timeouts and 5xx, which curl skips by default).
      - name: Call POST /internal/run-sweep
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Until the two secrets exist (docs/DEPLOY.md, step 6) there is nothing to call. Say so as a
          # warning instead of failing a red run every 5 minutes.
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::API_URL or CRON_SECRET is not set, so no sweep was triggered. See docs/DEPLOY.md, step 6."
            exit 0
          fi
          curl --fail-with-body --show-error --silent \
            --max-time 150 --retry 1 --retry-all-errors --retry-delay 5 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_URL/internal/run-sweep"
